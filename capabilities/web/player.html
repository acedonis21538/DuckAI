<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DuckAI Music</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .player {
            width: min(430px, 92vw);

            padding: 28px;

            border-radius: 24px;

            background: #1c1c1c;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .artwork {
            width: 100%;
            aspect-ratio: 1;

            object-fit: cover;

            border-radius: 18px;

            background: #292929;
        }

        .title {
            margin-top: 22px;

            font-size: 22px;
            font-weight: 700;
        }

        .artist {
            margin-top: 7px;

            color: #aaa;

            font-size: 15px;
        }

        .status {
            margin-top: 18px;

            color: #aaa;

            font-size: 13px;
        }

        audio {
            width: 100%;

            margin-top: 20px;
        }

        .buttons {
            display: flex;

            justify-content: center;
            gap: 10px;

            margin-top: 18px;
        }

        button {
            border: 0;

            padding: 11px 17px;

            border-radius: 12px;

            background: #303030;
            color: #fff;

            cursor: pointer;

            font-size: 14px;
        }

        button:hover {
            background: #414141;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    </style>

</head>

<body>

    <div class="player">

        <img
            id="artwork"
            class="artwork"
            alt="Album artwork"
        >

        <div
            id="title"
            class="title"
        >
            No song selected
        </div>

        <div
            id="artist"
            class="artist"
        >
            DuckAI Music
        </div>

        <div
            id="status"
            class="status"
        >
            Waiting for a song...
        </div>

        <audio
            id="audio"
            controls
            preload="auto"
        ></audio>

        <div class="buttons">

            <button
                id="playButton"
                onclick="playAudio()"
            >
                ▶️ Play
            </button>

            <button
                id="pauseButton"
                onclick="pauseAudio()"
            >
                ⏸️ Pause
            </button>

            <button
                id="stopButton"
                onclick="stopAudio()"
            >
                ⏹️ Stop
            </button>

        </div>

    </div>

<script>

    // ========================================================
    // GUILD
    // ========================================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const guildId =
        params.get('guildId');

    // ========================================================
    // ELEMENTS
    // ========================================================

    const audio =
        document.getElementById(
            'audio'
        );

    const artwork =
        document.getElementById(
            'artwork'
        );

    const title =
        document.getElementById(
            'title'
        );

    const artist =
        document.getElementById(
            'artist'
        );

    const status =
        document.getElementById(
            'status'
        );

    const playButton =
        document.getElementById(
            'playButton'
        );

    const pauseButton =
        document.getElementById(
            'pauseButton'
        );

    const stopButton =
        document.getElementById(
            'stopButton'
        );

    // ========================================================
    // CURRENT URL
    // ========================================================

    let currentUrl = null;

    // ========================================================
    // LOAD SONG
    // ========================================================

    async function loadSong() {

        if (!guildId) {

            status.textContent =
                'Missing server ID.';

            return;
        }

        try {

            const response =
                await fetch(
                    `/api/music/current?guildId=${encodeURIComponent(guildId)}`,
                    {
                        cache: 'no-store'
                    }
                );

            if (!response.ok) {

                throw new Error(
                    `API returned ${response.status}`
                );
            }

            const data =
                await response.json();

            if (
                !data.success ||
                !data.song ||
                !data.song.url
            ) {

                currentUrl = null;

                title.textContent =
                    'No song selected';

                artist.textContent =
                    'DuckAI Music';

                status.textContent =
                    'Waiting for a song...';

                playButton.disabled = true;

                return;
            }

            const song =
                data.song;

            title.textContent =
                song.title ||
                'Unknown title';

            artist.textContent =
                song.artist ||
                'Unknown artist';

            playButton.disabled = false;

            // ====================================================
            // ARTWORK
            // ====================================================

            if (
                song.artwork
            ) {

                artwork.src =
                    song.artwork;

            } else {

                artwork.removeAttribute(
                    'src'
                );
            }

            // ====================================================
            // NEW SONG
            // ====================================================

            if (
                currentUrl !==
                song.url
            ) {

                currentUrl =
                    song.url;

                audio.pause();

                audio.removeAttribute(
                    'src'
                );

                audio.load();

                audio.src =
                    song.url;

                audio.load();

                status.textContent =
                    'Ready to play';

                console.log(
                    '🎵 Loaded:',
                    song.title
                );

            } else {

                if (
                    !audio.paused
                ) {

                    status.textContent =
                        'Playing';

                } else {

                    status.textContent =
                        'Ready to play';
                }
            }

        } catch (error) {

            console.error(
                '❌ Music loading error:',
                error
            );

            status.textContent =
                'Unable to load the song.';
        }
    }

    // ========================================================
    // PLAY
    // ========================================================

    async function playAudio() {

        if (!currentUrl) {

            status.textContent =
                'No song is loaded.';

            return;
        }

        try {

            status.textContent =
                'Loading audio...';

            // Make sure the current URL is loaded.
            if (
                audio.src !==
                currentUrl
            ) {

                audio.src =
                    currentUrl;

                audio.load();
            }

            await audio.play();

            status.textContent =
                'Playing';

        } catch (error) {

            console.error(
                '❌ Playback error:',
                error
            );

            if (
                error.name ===
                'NotAllowedError'
            ) {

                status.textContent =
                    'Click Play to allow playback.';

            } else {

                status.textContent =
                    'Unable to play this audio stream.';
            }
        }
    }

    // ========================================================
    // PAUSE
    // ========================================================

    function pauseAudio() {

        if (
            audio.paused
        ) {

            return;
        }

        audio.pause();

        status.textContent =
            'Paused';
    }

    // ========================================================
    // STOP
    // ========================================================

    function stopAudio() {

        audio.pause();

        try {

            audio.currentTime =
                0;

        } catch {

            // Ignore seek errors.
        }

        status.textContent =
            'Stopped';
    }

    // ========================================================
    // AUDIO EVENTS
    // ========================================================

    audio.addEventListener(
        'loadstart',
        () => {

            status.textContent =
                'Loading audio...';
        }
    );

    audio.addEventListener(
        'loadedmetadata',
        () => {

            console.log(
                '🎵 Audio metadata loaded'
            );
        }
    );

    audio.addEventListener(
        'canplay',
        () => {

            if (
                audio.paused
            ) {

                status.textContent =
                    'Ready to play';
            }
        }
    );

    audio.addEventListener(
        'playing',
        () => {

            status.textContent =
                'Playing';
        }
    );

    audio.addEventListener(
        'pause',
        () => {

            if (
                !audio.ended &&
                audio.currentTime > 0
            ) {

                status.textContent =
                    'Paused';
            }
        }
    );

    audio.addEventListener(
        'waiting',
        () => {

            status.textContent =
                'Buffering...';
        }
    );

    audio.addEventListener(
        'ended',
        () => {

            status.textContent =
                'Finished';
        }
    );

    audio.addEventListener(
        'error',
        () => {

            const mediaError =
                audio.error;

            console.error(
                '❌ Audio error:',
                mediaError
            );

            if (
                mediaError
            ) {

                console.error(
                    'Media error code:',
                    mediaError.code
                );
            }

            status.textContent =
                'Audio stream failed to load.';
        }
    );

    // ========================================================
    // INITIAL LOAD
    // ========================================================

    loadSong();

    // ========================================================
    // CHECK FOR NEW SONG
    // ========================================================

    setInterval(
        loadSong,
        5000
    );

</script>

</body>

</html>
