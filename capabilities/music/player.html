<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DuckAI Music</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    color: white;

    font-family:
        Arial,
        sans-serif;
}

.player {

    width: 440px;

    max-width: 92vw;

    padding: 30px;

    border-radius: 24px;

    background:
        rgba(255,255,255,0.08);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.35);

    text-align: center;
}

.logo {

    font-size: 48px;
}

h1 {

    margin: 10px 0 5px;

    font-size: 24px;
}

.artist {

    opacity: 0.65;

    margin-bottom: 25px;
}

.cover {

    width: 240px;

    height: 240px;

    object-fit: cover;

    border-radius: 18px;

    margin-bottom: 25px;

    background: #111827;
}

.status {

    margin: 15px 0;

    font-size: 14px;

    opacity: 0.7;
}

.controls {

    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;
}

button {

    border: 0;

    padding: 12px 18px;

    border-radius: 12px;

    cursor: pointer;

    color: white;

    background: #374151;

    font-size: 14px;
}

button:hover {

    background: #4b5563;
}

.play {

    background: #16a34a;
}

.play:hover {

    background: #15803d;
}

.progress {

    width: 100%;

    margin-top: 25px;
}

input[type="range"] {

    width: 100%;

    cursor: pointer;
}

.time {

    display: flex;

    justify-content: space-between;

    margin-top: 6px;

    font-size: 12px;

    opacity: 0.6;
}

.volume {

    margin-top: 18px;
}

.message {

    margin-top: 15px;

    min-height: 20px;

    font-size: 13px;

    opacity: 0.7;
}

</style>

</head>

<body>

<div class="player">

    <div class="logo">
        🦆
    </div>

    <h1 id="title">
        DuckAI Music
    </h1>

    <div
        class="artist"
        id="artist"
    >
        No song selected
    </div>

    <img
        id="cover"
        class="cover"
        alt="Album artwork"
    >

    <div
        class="status"
        id="status"
    >
        Stopped
    </div>

    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <div class="controls">

        <button
            class="play"
            onclick="playMusic()"
        >
            ▶️ Play
        </button>

        <button
            onclick="pauseMusic()"
        >
            ⏸️ Pause
        </button>

        <button
            onclick="stopMusic()"
        >
            ⏹️ Stop
        </button>

    </div>

    <!-- =====================================================
         PROGRESS
         ===================================================== -->

    <div class="progress">

        <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
        >

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>

    <!-- =====================================================
         VOLUME
         ===================================================== -->

    <div class="volume">

        🔊

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            value="1"
            step="0.01"
        >

    </div>

    <!-- =====================================================
         AUDIO
         ===================================================== -->

    <audio
        id="audio"
        preload="auto"
    ></audio>

    <div
        id="message"
        class="message"
    ></div>

</div>

<script>

'use strict';

// ============================================================
// PARAMETERS
// ============================================================

const params =
    new URLSearchParams(
        window.location.search
    );

const guildId =
    params.get('guildId');

// ============================================================
// ELEMENTS
// ============================================================

const audio =
    document.getElementById(
        'audio'
    );

const title =
    document.getElementById(
        'title'
    );

const artist =
    document.getElementById(
        'artist'
    );

const cover =
    document.getElementById(
        'cover'
    );

const status =
    document.getElementById(
        'status'
    );

const progress =
    document.getElementById(
        'progress'
    );

const currentTime =
    document.getElementById(
        'currentTime'
    );

const duration =
    document.getElementById(
        'duration'
    );

const volume =
    document.getElementById(
        'volume'
    );

const message =
    document.getElementById(
        'message'
    );

// ============================================================
// STATE
// ============================================================

let currentSongId = null;

let loadingSong = false;

// ============================================================
// VALIDATION
// ============================================================

if (!guildId) {

    status.textContent =
        'Missing guildId';

    showMessage(
        'Open the player with ?guildId=YOUR_SERVER_ID'
    );
}

// ============================================================
// FORMAT TIME
// ============================================================

function formatTime(
    seconds
) {

    if (
        !Number.isFinite(
            seconds
        )
    ) {

        return '0:00';
    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        )
            .toString()
            .padStart(
                2,
                '0'
            );

    return `${minutes}:${secs}`;
}

// ============================================================
// MESSAGE
// ============================================================

function showMessage(
    text
) {

    message.textContent =
        text || '';
}

// ============================================================
// LOAD CURRENT MUSIC
// ============================================================

async function loadMusic() {

    if (!guildId) {

        return;
    }

    try {

        const response =
            await fetch(
                `/api/music/current?guildId=${encodeURIComponent(guildId)}`,
                {
                    cache: 'no-store'
                }
            );

        if (
            !response.ok
        ) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                'Music API error'
            );
        }

        // ====================================================
        // NO SONG
        // ====================================================

        if (
            !data.song
        ) {

            currentSongId =
                null;

            title.textContent =
                'DuckAI Music';

            artist.textContent =
                'No song selected';

            cover.removeAttribute(
                'src'
            );

            status.textContent =
                'Stopped';

            return;
        }

        const song =
            data.song;

        // ====================================================
        // UPDATE INFO
        // ====================================================

        title.textContent =
            song.title ||
            'Unknown title';

        artist.textContent =
            song.artist ||
            'Unknown artist';

        if (
            song.artwork
        ) {

            cover.src =
                song.artwork;

        } else {

            cover.removeAttribute(
                'src'
            );
        }

        // ====================================================
        // LOAD AUDIO ONLY WHEN SONG CHANGED
        // ====================================================

        if (
            currentSongId !==
            song.id
        ) {

            currentSongId =
                song.id;

            loadingSong =
                true;

            audio.pause();

            audio.src =
                song.url;

            audio.load();

            loadingSong =
                false;

            showMessage(
                '🎵 Music loaded. Press Play.'
            );
        }

        // ====================================================
        // SERVER STATE
        // ====================================================

        if (
            data.state ===
            'playing'
        ) {

            status.textContent =
                'Playing';

        } else if (
            data.state ===
            'paused'
        ) {

            status.textContent =
                'Paused';

        } else {

            status.textContent =
                'Stopped';
        }

    } catch (error) {

        console.error(
            '❌ Player API error:',
            error
        );

        status.textContent =
            'Connection error';

        showMessage(
            'Could not connect to DuckAI Music.'
        );
    }
}

// ============================================================
// PLAY
// ============================================================

async function playMusic() {

    if (!guildId) {

        return;
    }

    try {

        // ----------------------------------------------------
        // Make sure we have the current song
        // ----------------------------------------------------

        await loadMusic();

        if (!audio.src) {

            showMessage(
                '🎵 No song selected.'
            );

            return;
        }

        // ----------------------------------------------------
        // Browser playback
        // ----------------------------------------------------

        await audio.play();

        status.textContent =
            'Playing';

        showMessage(
            '▶️ Playing in your browser.'
        );

        // ----------------------------------------------------
        // Update server state
        // ----------------------------------------------------

        await fetch(
            '/api/music/play',
            {

                method:
                    'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({
                        guildId
                    })
            }
        );

    } catch (error) {

        console.error(
            '❌ Audio playback error:',
            error
        );

        status.textContent =
            'Playback error';

        showMessage(
            '❌ The browser could not play this audio stream.'
        );
    }
}

// ============================================================
// PAUSE
// ============================================================

async function pauseMusic() {

    try {

        audio.pause();

        status.textContent =
            'Paused';

        await fetch(
            '/api/music/pause',
            {

                method:
                    'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({
                        guildId
                    })
            }
        );

    } catch (error) {

        console.error(
            '❌ Pause error:',
            error
        );
    }
}

// ============================================================
// STOP
// ============================================================

async function stopMusic() {

    try {

        audio.pause();

        audio.currentTime =
            0;

        status.textContent =
            'Stopped';

        await fetch(
            '/api/music/stop',
            {

                method:
                    'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({
                        guildId
                    })
            }
        );

    } catch (error) {

        console.error(
            '❌ Stop error:',
            error
        );
    }
}

// ============================================================
// PROGRESS UPDATE
// ============================================================

audio.addEventListener(
    'timeupdate',
    () => {

        if (
            !Number.isFinite(
                audio.duration
            ) ||
            audio.duration <= 0
        ) {

            return;
        }

        progress.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

        duration.textContent =
            formatTime(
                audio.duration
            );
    }
);

// ============================================================
// SEEK
// ============================================================

progress.addEventListener(
    'input',
    () => {

        if (
            !Number.isFinite(
                audio.duration
            )
        ) {

            return;
        }

        audio.currentTime =
            (
                Number(
                    progress.value
                ) / 100
            ) *
            audio.duration;
    }
);

// ============================================================
// VOLUME
// ============================================================

volume.addEventListener(
    'input',
    () => {

        audio.volume =
            Number(
                volume.value
            );
    }
);

// ============================================================
// AUDIO EVENTS
// ============================================================

audio.addEventListener(
    'play',
    () => {

        status.textContent =
            'Playing';
    }
);

audio.addEventListener(
    'pause',
    () => {

        if (
            audio.currentTime > 0 &&
            !audio.ended
        ) {

            status.textContent =
                'Paused';
        }
    }
);

audio.addEventListener(
    'ended',
    async () => {

        status.textContent =
            'Stopped';

        progress.value =
            0;

        try {

            await fetch(
                '/api/music/stop',
                {

                    method:
                        'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            guildId
                        })
                }
            );

        } catch (error) {

            console.error(
                error
            );
        }
    }
);

audio.addEventListener(
    'error',
    () => {

        console.error(
            '❌ HTML audio error:',
            audio.error
        );

        status.textContent =
            'Audio error';

        showMessage(
            '❌ The audio stream could not be played by this browser.'
        );
    }
);

// ============================================================
// INITIAL LOAD
// ============================================================

loadMusic();

// ============================================================
// REFRESH
// ============================================================

setInterval(
    loadMusic,
    5000
);

</script>

</body>

</html>
